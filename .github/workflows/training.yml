name: Training Pipeline

on:
  schedule:
    - cron: '0 2 * * *'  # every day at 02:00 UTC (07:00 PKT)
  workflow_dispatch:      # allows manual run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv supabase pandas scikit-learn xgboost lightgbm shap joblib numpy matplotlib seaborn

      - name: Run EDA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python notebooks/eda.py

      - name: Run training pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python notebooks/training.py

      - name: Commit updated models and plots to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ eda_plots/
          git diff --cached --quiet || git commit -m "chore: update models + EDA plots [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push